<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Build Lab — Anna University</title>
  <meta name="color-scheme" content="dark light" />
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("iot-workshop-theme") === "light" ? "light" : "dark";
    } catch {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-kicker">Anna University workshop</p>
          <p class="brand-title">IoT Build Lab</p>
        </div>
        <button type="button" class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">×</button>
      </div>
      <div class="sidebar-heading">
        <span>Workshop map</span>
        <span id="sidebar-progress">0 complete</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Workshop steps"></nav>
      <div class="sidebar-foot">
        <button type="button" class="text-btn" id="reset-progress">Reset progress</button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open modules">☰</button>
        <div class="location-wrap">
          <p id="current-phase">Morning</p>
          <strong id="current-module">Start here</strong>
        </div>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="progress-label">Step 1 of 1</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <button type="button" class="ghost-btn theme-toggle" id="theme-toggle" aria-pressed="false">Light mode</button>
        <button type="button" class="ghost-btn" id="pin-map-btn">Pin reference</button>
      </header>

      <div id="gate-banner" class="gate-banner" hidden role="alert">
        <strong>Stay on this step.</strong>
        <span id="gate-banner-text">Tick the checkpoint below after you finish the work. Next will not move on until you do.</span>
      </div>
      <main class="step-view" id="step-view" aria-live="polite"></main>

      <footer class="step-nav">
        <button type="button" class="nav-btn" id="btn-back">Previous</button>
        <p class="nav-hint" id="nav-hint" aria-live="polite"></p>
        <button type="button" class="nav-btn nav-btn-next" id="btn-next">Continue</button>
      </footer>
    </div>
  </div>

  <div id="pin-drawer" class="drawer" hidden>
    <div class="drawer-card">
      <div class="drawer-head">
        <h2>Quick reference</h2>
        <button type="button" class="icon-btn" id="pin-map-close" aria-label="Close">×</button>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>Item</th><th>Use</th><th>This pass</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="note"></p>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
