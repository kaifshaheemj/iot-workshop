<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f4f7fb"/>
  <rect x="0" y="0" width="18" height="1080" fill="#0d7a6c"/>
  <text x="120" y="180" font-family="Times New Roman, Times, serif" font-size="56" fill="#1c2433">Where the code runs</text>
  <text x="120" y="340" font-family="Calibri, Arial, sans-serif" font-size="32" fill="#1c2433">Write in Arduino IDE on the laptop. Upload over a USB data cable.</text>
  <text x="120" y="430" font-family="Calibri, Arial, sans-serif" font-size="32" fill="#1c2433">Serial Monitor baud must match the sketch (115200).</text>
  <text x="120" y="520" font-family="Calibri, Arial, sans-serif" font-size="32" fill="#1c2433">A board can also host a page on its own Wi-Fi. No internet needed.</text>
  <text x="120" y="680" font-family="Calibri, Arial, sans-serif" font-size="28" fill="#5d6b80">Afternoon labs stay locked until the facilitator opens them.</text>
  <text x="120" y="980" font-family="Calibri, Arial, sans-serif" font-size="22" fill="#5d6b80">This slider never unlocks the labs. Use the playbook after lunch.</text>
</svg>
