name: Pages and workshop zips

on:
  push:
    branches: [main, master, nithish]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: workshop-pages
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (live playbook)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main
      - name: Checkout nithish (preview)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: nithish
          path: src-nithish
      - name: Assemble site
        run: |
          mkdir -p _site/workshop
          cp -a src-main/workshop/. _site/workshop/
          touch _site/.nojekyll _site/workshop/.nojekyll
          if [ -d src-main/sketches ]; then
            mkdir -p _site/sketches
            cp -a src-main/sketches/. _site/sketches/
          fi
          if [ -d src-main/presentations ]; then
            mkdir -p _site/presentations
            cp -a src-main/presentations/. _site/presentations/
          fi

          if [ -d src-nithish/workshop ]; then
            mkdir -p _site/nithish/workshop
            cp -a src-nithish/workshop/. _site/nithish/workshop/
            touch _site/nithish/.nojekyll _site/nithish/workshop/.nojekyll
            if [ -d src-nithish/sketches ]; then
              mkdir -p _site/nithish/sketches
              cp -a src-nithish/sketches/. _site/nithish/sketches/
            fi
            if [ -d src-nithish/presentations ]; then
              mkdir -p _site/nithish/presentations
              cp -a src-nithish/presentations/. _site/nithish/presentations/
            fi
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en"><head><meta charset="utf-8">' \
              '<meta http-equiv="refresh" content="0; url=workshop/">' \
              '<title>Nithish preview</title>' \
              '</head><body>' \
              '<p><a href="workshop/">Open the nithish playbook</a></p>' \
              '</body></html>' > _site/nithish/index.html
          fi

          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="en"><head><meta charset="utf-8">' \
            '<title>University IoT workshop</title>' \
            '</head><body>' \
            '<p><a href="workshop/">Workshop playbook (main)</a></p>' \
            '<p><a href="nithish/workshop/">Nithish preview</a></p>' \
            '</body></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

  zips:
    name: Morning and afternoon zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build offline zip packs
        run: |
          mkdir -p dist morning-pack/workshop morning-pack/sketches morning-pack/presentations
          cp -a workshop/. morning-pack/workshop/
          cp -a sketches/exercises morning-pack/sketches/
          cp -a presentations/. morning-pack/presentations/
          printf '%s\n' 'Morning pack: open workshop/index.html. The presentation and Exercises 1-8 are included for offline use.' > morning-pack/README.txt
          (cd morning-pack && zip -r ../dist/workshop-morning.zip . -x "*.git*")
          mkdir -p pack/workshop pack/sketches pack/presentations
          cp -a workshop/. pack/workshop/
          cp -a sketches/exercises pack/sketches/
          cp -a presentations/. pack/presentations/
          cp -a sketches/traffic pack/sketches/
          cp -a sketches/tripwire pack/sketches/
          cp -a sketches/reaction pack/sketches/
          printf '%s\n' 'Complete pack: open workshop/index.html. Morning exercises and afternoon project sketches are under sketches/.' > pack/README.txt
          (cd pack && zip -r ../dist/workshop-afternoon.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-offline-zips
          path: dist/*.zip
      - name: Attach zips to git tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/workshop-morning.zip
            dist/workshop-afternoon.zip
