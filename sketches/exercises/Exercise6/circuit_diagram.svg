<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <defs><style>
    text{font-family:Arial,sans-serif}.title{font-size:42px;font-weight:700}.sub{font-size:21px;fill:#526174}.head{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px;fill:#425466}.pin text{font-size:16px;fill:#ffffff;font-weight:700}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.panel{fill:white;stroke:#b8c5d4;stroke-width:3}
  </style></defs>
  <text x="60" y="62" class="title">Exercise 6 - Ultrasonic Distance on SH1106 OLED</text>
  <text x="60" y="98" class="sub">This diagram is for the 3.3 V HC-SR04 version in GPIO TRIG/ECHO mode</text>

  <rect x="570" y="165" width="460" height="660" rx="35" fill="#16324a" stroke="#0b2032" stroke-width="6"/>
  <text x="800" y="225" text-anchor="middle" font-size="31" font-weight="700" style="fill:#fff">ESP32 DEV MODULE</text>
  <g class="pin"><text style="fill:#fff" x="605" y="325">3V3</text><text style="fill:#fff" x="605" y="425">GPIO5 TRIG</text><text style="fill:#fff" x="605" y="525">GPIO18 ECHO</text><text style="fill:#fff" x="605" y="625">GND</text><text style="fill:#fff" x="995" y="365" text-anchor="end">GPIO21 SDA</text><text style="fill:#fff" x="995" y="465" text-anchor="end">GPIO22 SCL</text><text style="fill:#fff" x="995" y="565" text-anchor="end">3V3</text><text style="fill:#fff" x="995" y="665" text-anchor="end">GND</text></g>
  <g fill="#3182ce"><circle cx="570" cy="318" r="12"/><circle cx="570" cy="418" r="12"/><circle cx="570" cy="518" r="12"/><circle cx="570" cy="618" r="12"/><circle cx="1030" cy="358" r="12"/><circle cx="1030" cy="458" r="12"/><circle cx="1030" cy="558" r="12"/><circle cx="1030" cy="658" r="12"/></g>

  <rect x="45" y="165" width="470" height="660" rx="25" class="panel"/><text x="280" y="210" text-anchor="middle" class="head">3.3 V HC-SR04</text>
  <rect x="95" y="250" width="370" height="285" rx="24" fill="#e8edf2" stroke="#526174" stroke-width="5"/><text x="280" y="290" text-anchor="middle" class="label">ULTRASONIC SENSOR</text>
  <circle cx="185" cy="395" r="72" fill="#aeb9c5" stroke="#526174" stroke-width="6"/><circle cx="375" cy="395" r="72" fill="#aeb9c5" stroke="#526174" stroke-width="6"/><circle cx="185" cy="395" r="48" fill="#dce3e9"/><circle cx="375" cy="395" r="48" fill="#dce3e9"/>
  <text x="280" y="505" text-anchor="middle" class="small">VCC  TRIG  ECHO  GND</text>
  <path d="M515 318H570" class="wire" stroke="#e53e3e"/><path d="M515 418H570" class="wire" stroke="#805ad5"/><path d="M515 518H570" class="wire" stroke="#3182ce"/><path d="M515 618H570" class="wire" stroke="#252d38"/>
  <g class="small"><text x="430" y="305">VCC: 3V3</text><text x="425" y="405">TRIG</text><text x="425" y="505">ECHO</text><text x="440" y="605">GND</text></g>
  <rect x="90" y="575" width="380" height="105" rx="16" fill="#eef9f0" stroke="#2f855a" stroke-width="3"/><text x="280" y="612" text-anchor="middle" class="label">DIRECT 3.3 V CONNECTION</text><text x="280" y="642" text-anchor="middle" class="small">No ECHO voltage divider required</text><text x="280" y="666" text-anchor="middle" class="small">R4 and R5 remain OPEN for GPIO mode</text>
  <text x="280" y="735" text-anchor="middle" class="label">SENSOR POWER: 3.3 V</text>

  <rect x="1080" y="165" width="475" height="660" rx="25" class="panel"/><text x="1317" y="210" text-anchor="middle" class="head">SH1106 128x64 OLED</text>
  <rect x="1150" y="260" width="335" height="280" rx="18" fill="#176aa0" stroke="#0d466d" stroke-width="6"/><rect x="1185" y="295" width="265" height="180" rx="8" fill="#081923" stroke="#9edcf5" stroke-width="3"/>
  <text x="1317" y="345" text-anchor="middle" font-size="25" style="fill:#dff8ff">Distance</text><text x="1317" y="420" text-anchor="middle" font-size="32" font-weight="700" style="fill:#dff8ff">123.4 cm</text>
  <text x="1317" y="515" text-anchor="middle" font-size="15" fill="white">GND  VCC  SCL  SDA</text>
  <path d="M1030 358H1080" class="wire" stroke="#3182ce"/><path d="M1030 458H1080" class="wire" stroke="#d69e2e"/><path d="M1030 558H1080" class="wire" stroke="#e53e3e"/><path d="M1030 658H1080" class="wire" stroke="#252d38"/>
  <g class="small"><text x="1095" y="345">SDA: GPIO21</text><text x="1095" y="445">SCL: GPIO22</text><text x="1095" y="545">OLED VCC: 3V3</text><text x="1095" y="645">OLED GND</text></g>
  <rect x="1130" y="700" width="375" height="80" rx="16" fill="#eef9f0" stroke="#2f855a" stroke-width="3"/><text x="1317" y="735" text-anchor="middle" class="label">OLED POWER: 3.3 V</text><text x="1317" y="762" text-anchor="middle" class="small">I2C address: 0x3C</text>

  <rect x="60" y="855" width="1480" height="105" rx="22" fill="#e9f7ef" stroke="#2f855a" stroke-width="4"/>
  <text x="95" y="895" class="head">Arduino libraries to install</text><text x="95" y="930" class="small">Adafruit GFX Library + Adafruit SH110X</text>
</svg>
