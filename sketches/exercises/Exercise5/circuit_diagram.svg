<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <defs><style>
    text{font-family:Arial,sans-serif}.title{font-size:42px;font-weight:700}.sub{font-size:21px;fill:#526174}.head{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#425466}.pin text{font-size:15px;fill:#ffffff;font-weight:700}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.panel{fill:white;stroke:#b8c5d4;stroke-width:3}
  </style></defs>
  <text x="60" y="62" class="title">Exercise 5 - DHT11 Temperature Alarm on 16x2 LCD</text>
  <text x="60" y="98" class="sub">Above 35 C the 5 V passive buzzer beeps 500 ms ON / 500 ms OFF</text>

  <rect x="540" y="165" width="470" height="660" rx="35" fill="#16324a" stroke="#0b2032" stroke-width="6"/>
  <text x="775" y="220" text-anchor="middle" font-size="31" font-weight="700" style="fill:#fff">ESP32 DEV MODULE</text>
  <g class="pin"><text style="fill:#fff" x="575" y="320">3V3</text><text style="fill:#fff" x="575" y="420">GPIO4 DHT DATA</text><text style="fill:#fff" x="575" y="620">GPIO27 BUZZER PWM</text><text style="fill:#fff" x="575" y="735">GND</text><text style="fill:#fff" x="975" y="320" text-anchor="end">VIN / 5V</text><text style="fill:#fff" x="975" y="430" text-anchor="end">GPIO21 SDA</text><text style="fill:#fff" x="975" y="530" text-anchor="end">GPIO22 SCL</text><text style="fill:#fff" x="975" y="650" text-anchor="end">GND</text></g>
  <g fill="#3182ce"><circle cx="540" cy="313" r="11"/><circle cx="540" cy="413" r="11"/><circle cx="540" cy="613" r="11"/><circle cx="540" cy="728" r="11"/><circle cx="1010" cy="313" r="11"/><circle cx="1010" cy="423" r="11"/><circle cx="1010" cy="523" r="11"/><circle cx="1010" cy="643" r="11"/></g>

  <rect x="45" y="160" width="440" height="360" rx="25" class="panel"/><text x="265" y="202" text-anchor="middle" class="head">DHT11 MODULE</text>
  <rect x="145" y="235" width="240" height="190" rx="24" fill="#3d8fc2" stroke="#24658b" stroke-width="5"/><rect x="195" y="268" width="140" height="95" rx="12" fill="#dceef8"/>
  <g fill="#75a8c6"><circle cx="220" cy="292" r="7"/><circle cx="265" cy="292" r="7"/><circle cx="310" cy="292" r="7"/><circle cx="220" cy="332" r="7"/><circle cx="265" cy="332" r="7"/><circle cx="310" cy="332" r="7"/></g>
  <text x="265" y="398" text-anchor="middle" class="label">VCC  DATA  GND</text>
  <path d="M485 313H540" class="wire" stroke="#e53e3e"/><path d="M485 413H540" class="wire" stroke="#805ad5"/><path d="M465 455V728H540" class="wire" stroke="#252d38"/>
  <g class="small"><text x="395" y="300">VCC: 3V3</text><text x="385" y="400">DATA: GPIO4</text><text x="365" y="477">GND</text></g>
  <rect x="85" y="450" width="360" height="52" rx="14" fill="#eef9f0" stroke="#2f855a" stroke-width="3"/><text x="265" y="483" text-anchor="middle" class="label">DHT11 POWER: 3.3 V</text>

  <rect x="45" y="550" width="440" height="275" rx="25" class="panel"/><text x="265" y="590" text-anchor="middle" class="head">5 V PASSIVE BUZZER DRIVER</text>
  <circle cx="175" cy="680" r="54" fill="#252d38" stroke="#111" stroke-width="5"/><circle cx="175" cy="680" r="23" fill="#0c1115"/><text x="175" y="755" text-anchor="middle" class="small">Passive buzzer</text>
  <circle cx="350" cy="690" r="38" fill="#dde4ea" stroke="#526174" stroke-width="4"/><text x="350" y="696" text-anchor="middle" class="label">NPN</text>
  <rect x="375" y="602" width="78" height="38" rx="8" fill="#fff3cd" stroke="#d39e00" stroke-width="3"/><text x="414" y="627" text-anchor="middle" class="small">1K</text><path d="M485 613H453" class="wire" stroke="#805ad5"/><path d="M375 621H350V652" class="wire" stroke="#805ad5"/>
  <path d="M175 626V610H95" class="wire" stroke="#e53e3e"/><text x="95" y="598" class="label">5V</text><path d="M175 734H312V690" class="wire" stroke="#252d38"/><path d="M350 728V790H465V728" class="wire" stroke="#252d38"/>
  <text x="265" y="805" text-anchor="middle" class="small">GPIO27 drives the transistor; never drive a 5 V buzzer directly.</text>

  <rect x="1060" y="165" width="495" height="660" rx="25" class="panel"/><text x="1307" y="210" text-anchor="middle" class="head">16x2 I2C LCD</text>
  <rect x="1120" y="260" width="375" height="225" rx="12" fill="#2f855a" stroke="#1f5d3e" stroke-width="6"/><rect x="1155" y="302" width="305" height="115" rx="8" fill="#b9d66b" stroke="#3e5e28" stroke-width="4"/>
  <text x="1175" y="347" font-family="monospace" font-size="24">Temp:36.2 C</text><text x="1175" y="390" font-family="monospace" font-size="24">Hum :58.0%</text>
  <rect x="1200" y="500" width="215" height="72" rx="10" fill="#2867a0" stroke="#17466e" stroke-width="4"/><text x="1307" y="530" text-anchor="middle" font-size="15" fill="white">I2C BACKPACK</text><text x="1307" y="555" text-anchor="middle" font-size="14" fill="white">GND VCC SDA SCL</text>
  <path d="M1010 313H1060" class="wire" stroke="#e53e3e"/><path d="M1010 423H1060" class="wire" stroke="#3182ce"/><path d="M1010 523H1060" class="wire" stroke="#d69e2e"/><path d="M1010 643H1060" class="wire" stroke="#252d38"/>
  <g class="small"><text x="1075" y="300">LCD VCC: 5V</text><text x="1075" y="410">SDA: GPIO21</text><text x="1075" y="510">SCL: GPIO22</text><text x="1075" y="630">LCD GND</text></g>
  <rect x="1110" y="680" width="395" height="120" rx="16" fill="#fff7e6" stroke="#d69e2e" stroke-width="3"/><text x="1307" y="713" text-anchor="middle" class="label">LCD POWER: 5 V</text><text x="1307" y="741" text-anchor="middle" class="small">Address auto-detected (0x27 / 0x3F)</text><text x="1307" y="772" text-anchor="middle" class="small">Use 3.3 V-safe I2C level shifting</text>

  <rect x="60" y="855" width="1480" height="105" rx="22" fill="#e9f7ef" stroke="#2f855a" stroke-width="4"/>
  <text x="95" y="895" class="head">Arduino libraries to install</text><text x="95" y="930" class="small">DHT sensor library by Adafruit + Adafruit Unified Sensor + LiquidCrystal I2C</text>
</svg>
