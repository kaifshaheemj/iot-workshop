<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <defs><style>
    text{font-family:Arial,sans-serif}.title{font-size:42px;font-weight:700}.sub{font-size:21px;fill:#526174}.head{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#425466}.pin text{font-size:15px;fill:#ffffff;font-weight:700}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.panel{fill:white;stroke:#b8c5d4;stroke-width:3}
  </style></defs>
  <text x="60" y="62" class="title">Exercise 5 - DHT11 Temperature Alarm on 16x2 LCD</text>
  <text x="60" y="98" class="sub">Above 35 C the buzzer module alternates 500 ms ON / 500 ms OFF</text>

  <rect x="540" y="165" width="470" height="660" rx="35" fill="#16324a" stroke="#0b2032" stroke-width="6"/>
  <text x="775" y="220" text-anchor="middle" font-size="31" font-weight="700" style="fill:#fff">ESP32 DEV MODULE</text>
  <g class="pin"><text style="fill:#fff" x="575" y="305">3V3</text><text style="fill:#fff" x="575" y="405">GPIO4 DHT DATA</text><text style="fill:#fff" x="575" y="555">GPIO27 BUZZER IN</text><text style="fill:#fff" x="575" y="655">5V / VIN</text><text style="fill:#fff" x="575" y="755">GND</text><text style="fill:#fff" x="975" y="320" text-anchor="end">5V / VIN</text><text style="fill:#fff" x="975" y="430" text-anchor="end">GPIO21 SDA</text><text style="fill:#fff" x="975" y="530" text-anchor="end">GPIO22 SCL</text><text style="fill:#fff" x="975" y="650" text-anchor="end">GND</text></g>
  <g fill="#3182ce"><circle cx="540" cy="298" r="11"/><circle cx="540" cy="398" r="11"/><circle cx="540" cy="548" r="11"/><circle cx="540" cy="648" r="11"/><circle cx="540" cy="748" r="11"/><circle cx="1010" cy="313" r="11"/><circle cx="1010" cy="423" r="11"/><circle cx="1010" cy="523" r="11"/><circle cx="1010" cy="643" r="11"/></g>

  <rect x="45" y="155" width="440" height="345" rx="25" class="panel"/><text x="265" y="198" text-anchor="middle" class="head">DHT11 MODULE</text>
  <rect x="145" y="225" width="240" height="185" rx="24" fill="#3d8fc2" stroke="#24658b" stroke-width="5"/><rect x="195" y="258" width="140" height="92" rx="12" fill="#dceef8"/><text x="265" y="390" text-anchor="middle" class="label">VCC  DATA  GND</text>
  <path d="M485 298H540" class="wire" stroke="#e53e3e"/><path d="M485 398H540" class="wire" stroke="#805ad5"/><path d="M465 445V748H540" class="wire" stroke="#252d38"/>
  <g class="small"><text x="395" y="285">VCC: 3V3</text><text x="385" y="385">DATA: GPIO4</text><text x="405" y="470">GND</text></g>

  <rect x="45" y="530" width="440" height="295" rx="25" class="panel"/><text x="265" y="575" text-anchor="middle" class="head">BUZZER MODULE</text>
  <rect x="125" y="615" width="280" height="135" rx="20" fill="#343b44" stroke="#111820" stroke-width="5"/><circle cx="210" cy="680" r="42" fill="#171c21"/><circle cx="210" cy="680" r="17" fill="#050708"/><text x="330" y="650" class="label">IN</text><text x="330" y="690" class="label">VCC</text><text x="330" y="730" class="label">GND</text>
  <path d="M405 645H485V548H540" class="wire" stroke="#805ad5"/><path d="M405 685H500V648H540" class="wire" stroke="#e53e3e"/><path d="M405 725H500V748H540" class="wire" stroke="#252d38"/>
  <text x="265" y="790" text-anchor="middle" class="small">IN: GPIO27 · VCC: 5V · GND: GND</text>

  <rect x="1060" y="165" width="495" height="660" rx="25" class="panel"/><text x="1307" y="210" text-anchor="middle" class="head">16x2 I2C LCD</text>
  <rect x="1120" y="260" width="375" height="225" rx="12" fill="#2f855a" stroke="#1f5d3e" stroke-width="6"/><rect x="1155" y="302" width="305" height="115" rx="8" fill="#b9d66b" stroke="#3e5e28" stroke-width="4"/>
  <text x="1175" y="347" font-family="monospace" font-size="24">Temp:36.2 C</text><text x="1175" y="390" font-family="monospace" font-size="24">Hum :58.0%</text>
  <rect x="1200" y="500" width="215" height="72" rx="10" fill="#2867a0" stroke="#17466e" stroke-width="4"/><text x="1307" y="530" text-anchor="middle" font-size="15" fill="white">I2C BACKPACK</text><text x="1307" y="555" text-anchor="middle" font-size="14" fill="white">GND VCC SDA SCL</text>
  <path d="M1010 313H1060" class="wire" stroke="#e53e3e"/><path d="M1010 423H1060" class="wire" stroke="#3182ce"/><path d="M1010 523H1060" class="wire" stroke="#d69e2e"/><path d="M1010 643H1060" class="wire" stroke="#252d38"/>
  <g class="small"><text x="1075" y="300">LCD VCC: 5V</text><text x="1075" y="410">SDA: GPIO21</text><text x="1075" y="510">SCL: GPIO22</text><text x="1075" y="630">LCD GND</text></g>
  <rect x="1110" y="690" width="395" height="90" rx="16" fill="#eef9f0" stroke="#2f855a" stroke-width="3"/><text x="1307" y="725" text-anchor="middle" class="label">LCD POWER: 5 V</text><text x="1307" y="755" text-anchor="middle" class="small">Address auto-detected: 0x27 or 0x3F</text>

  <rect x="60" y="855" width="1480" height="105" rx="22" fill="#e9f7ef" stroke="#2f855a" stroke-width="4"/>
  <text x="95" y="895" class="head">Arduino libraries to install</text><text x="95" y="930" class="small">DHT sensor library by Adafruit + Adafruit Unified Sensor + LiquidCrystal I2C</text>
</svg>
