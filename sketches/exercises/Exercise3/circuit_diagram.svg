  <rect x="90" y="840" width="1420" height="110" rx="22" fill="#e9f7ef" stroke="#2f855a" stroke-width="4"/>
  <text x="125" y="885" class="head">Arduino libraries to install</text><text x="125" y="922" class="small">None - uses built-in ESP32 GPIO and timing functions.</text>
