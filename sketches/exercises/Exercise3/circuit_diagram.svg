<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <defs><style>
    text{font-family:Arial,sans-serif}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#526174}.head{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:700}.small{font-size:18px;fill:#425466}.pin text{font-size:19px;fill:#ffffff;font-weight:700}.wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.box{fill:white;stroke:#263b50;stroke-width:4}
  </style></defs>
  <text x="70" y="70" class="title">Exercise 3 - Traffic Light Sequence</text>
  <text x="70" y="108" class="sub">Red 5 s, red + yellow 1 s, green 5 s, yellow 2 s</text>

  <rect x="130" y="190" width="470" height="600" rx="38" fill="#16324a" stroke="#0b2032" stroke-width="6"/>
  <text x="365" y="255" text-anchor="middle" font-size="34" font-weight="700" style="fill:#fff">ESP32 DEV MODULE</text>
  <g class="pin"><text style="fill:#fff" x="555" y="390" text-anchor="end">GPIO16 RED</text><text style="fill:#fff" x="555" y="510" text-anchor="end">GPIO17 YELLOW</text><text style="fill:#fff" x="555" y="630" text-anchor="end">GPIO18 GREEN</text><text style="fill:#fff" x="365" y="750" text-anchor="middle">GND</text></g>
  <g fill="#3182ce"><circle cx="600" cy="383" r="14"/><circle cx="600" cy="503" r="14"/><circle cx="600" cy="623" r="14"/></g><circle cx="365" cy="790" r="14" fill="#222"/>

  <path d="M614 383H800" class="wire" stroke="#e53e3e"/><path d="M614 503H800" class="wire" stroke="#d69e2e"/><path d="M614 623H800" class="wire" stroke="#38a169"/>
  <g><rect x="800" y="355" width="165" height="56" rx="11" class="box"/><rect x="800" y="475" width="165" height="56" rx="11" class="box"/><rect x="800" y="595" width="165" height="56" rx="11" class="box"/></g>
  <g class="small" text-anchor="middle"><text x="882" y="390">220-330 ohm</text><text x="882" y="510">220-330 ohm</text><text x="882" y="630">220-330 ohm</text></g>

  <rect x="1060" y="180" width="315" height="590" rx="48" fill="#242b33" stroke="#111820" stroke-width="7"/>
  <circle cx="1218" cy="335" r="78" fill="#ff4141" stroke="#8b1414" stroke-width="8"/><circle cx="1218" cy="475" r="78" fill="#ffd43b" stroke="#8c6d00" stroke-width="8"/><circle cx="1218" cy="615" r="78" fill="#3fda68" stroke="#126f31" stroke-width="8"/>
  <path d="M965 383H1060V335H1140M965 503H1140M965 623H1060V615H1140" class="wire" stroke="#4a5568"/>
  <path d="M1218 413V790M1218 553V790M1218 693V790M1218 790H365" class="wire" stroke="#252d38"/>
