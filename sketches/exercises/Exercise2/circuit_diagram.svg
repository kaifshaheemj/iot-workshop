  </g>
  <path d="M1340 328V790H800V810M1340 458V790M1340 588V790M1340 718V790M520 342V790M520 472V790M520 602V790M520 732V790" class="wire" stroke="#252d38"/>

  <rect x="70" y="855" width="1460" height="100" rx="20" fill="#e9f7ef" stroke="#2f855a" stroke-width="4"/>
  <text x="105" y="895" class="head">Arduino libraries to install</text><text x="105" y="930" class="small">None - software debounce is built into the sketch. No debounce capacitors are used.</text>
