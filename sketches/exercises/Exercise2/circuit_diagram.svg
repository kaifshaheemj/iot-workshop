<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <defs><style>
    text{font-family:Arial,sans-serif}.title{font-size:42px;font-weight:700}.sub{font-size:21px;fill:#526174}.head{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#425466}.pin text{font-size:16px;fill:#ffffff;font-weight:700}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:white;stroke:#b8c5d4;stroke-width:3}.part{fill:#f8fafc;stroke:#263b50;stroke-width:3}
  </style></defs>
  <text x="60" y="62" class="title">Exercise 2 - Four Push Buttons Control Four LEDs</text>
  <text x="60" y="98" class="sub">External 10K pull-ups; buttons connect directly to GND; no debounce capacitors</text>

  <rect x="605" y="160" width="390" height="650" rx="35" fill="#16324a" stroke="#0b2032" stroke-width="6"/>
  <text x="800" y="215" text-anchor="middle" font-size="30" font-weight="700" style="fill:#fff">ESP32 DEV MODULE</text>
  <g class="pin"><text style="fill:#fff" x="630" y="305">GPIO25</text><text style="fill:#fff" x="630" y="435">GPIO26</text><text style="fill:#fff" x="630" y="565">GPIO27</text><text style="fill:#fff" x="630" y="695">GPIO32</text><text style="fill:#fff" x="970" y="305" text-anchor="end">GPIO16</text><text style="fill:#fff" x="970" y="435" text-anchor="end">GPIO17</text><text style="fill:#fff" x="970" y="565" text-anchor="end">GPIO18</text><text style="fill:#fff" x="970" y="695" text-anchor="end">GPIO19</text><text style="fill:#fff" x="800" y="775" text-anchor="middle">GND</text></g>
  <g fill="#3182ce"><circle cx="605" cy="298" r="11"/><circle cx="605" cy="428" r="11"/><circle cx="605" cy="558" r="11"/><circle cx="605" cy="688" r="11"/><circle cx="995" cy="298" r="11"/><circle cx="995" cy="428" r="11"/><circle cx="995" cy="558" r="11"/><circle cx="995" cy="688" r="11"/></g><circle cx="800" cy="810" r="12" fill="#222"/>

  <rect x="45" y="150" width="520" height="665" rx="25" class="panel"/>
