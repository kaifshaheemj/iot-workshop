    <text x="70" y="405" font-weight="700">3V3</text><rect x="120" y="380" width="115" height="40" rx="8" fill="#fff3cd" stroke="#d39e00" stroke-width="3"/><text x="177" y="406" text-anchor="middle">10K pull-up</text><path d="M105 400H120M235 400H300V428H605" class="wire" stroke="#805ad5"/><circle cx="300" cy="428" r="7" fill="#805ad5"/><rect x="350" y="450" width="105" height="44" rx="10" class="part"/><circle cx="385" cy="472" r="10" fill="#d7dde5"/><circle cx="420" cy="472" r="10" fill="#d7dde5"/><text x="480" y="477" class="label">PB2</text><path d="M300 428V472H375M430 472H520" class="wire" stroke="#252d38"/><text x="485" y="460">GND</text>
    <text x="70" y="535" font-weight="700">3V3</text><rect x="120" y="510" width="115" height="40" rx="8" fill="#fff3cd" stroke="#d39e00" stroke-width="3"/><text x="177" y="536" text-anchor="middle">10K pull-up</text><path d="M105 530H120M235 530H300V558H605" class="wire" stroke="#805ad5"/><circle cx="300" cy="558" r="7" fill="#805ad5"/><rect x="350" y="580" width="105" height="44" rx="10" class="part"/><circle cx="385" cy="602" r="10" fill="#d7dde5"/><circle cx="420" cy="602" r="10" fill="#d7dde5"/><text x="480" y="607" class="label">PB3</text><path d="M300 558V602H375M430 602H520" class="wire" stroke="#252d38"/><text x="485" y="590">GND</text>
    <text x="70" y="665" font-weight="700">3V3</text><rect x="120" y="640" width="115" height="40" rx="8" fill="#fff3cd" stroke="#d39e00" stroke-width="3"/><text x="177" y="666" text-anchor="middle">10K pull-up</text><path d="M105 660H120M235 660H300V688H605" class="wire" stroke="#805ad5"/><circle cx="300" cy="688" r="7" fill="#805ad5"/><rect x="350" y="710" width="105" height="44" rx="10" class="part"/><circle cx="385" cy="732" r="10" fill="#d7dde5"/><circle cx="420" cy="732" r="10" fill="#d7dde5"/><text x="480" y="737" class="label">PB4</text><path d="M300 688V732H375M430 732H520" class="wire" stroke="#252d38"/><text x="485" y="720">GND</text>
  </g>

