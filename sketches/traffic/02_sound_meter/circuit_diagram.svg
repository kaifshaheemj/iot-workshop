<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Traffic Signal stage 2 wiring</title><desc id="desc">Three traffic LEDs on GPIO 4, 2, and 16 plus KY-037 digital output on GPIO 17, powered from 3.3 volts with common ground. Analog output is unused.</desc>
<rect width="1600" height="1000" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#526174}.label{font-size:21px;font-weight:700}.small{font-size:17px}.pin{font-size:18px;fill:#fff;font-weight:700}.wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#263b50;stroke-width:4}</style>
<text x="70" y="72" class="title">Traffic Signal — Stage 2</text><text x="70" y="112" class="sub">Add KY-037 DO on GPIO 17 • AO remains unconnected</text>
<rect x="590" y="190" width="410" height="660" rx="38" fill="#16324a" stroke="#0b2032" stroke-width="6"/><text x="795" y="250" text-anchor="middle" font-size="36" font-weight="700" fill="white">ESP32</text>
<circle cx="1000" cy="330" r="13" fill="#e53e3e"/><circle cx="1000" cy="440" r="13" fill="#d69e2e"/><circle cx="1000" cy="550" r="13" fill="#38a169"/><text x="965" y="336" text-anchor="end" class="pin">GPIO4</text><text x="965" y="446" text-anchor="end" class="pin">GPIO2</text><text x="965" y="556" text-anchor="end" class="pin">GPIO16</text>
<circle cx="590" cy="420" r="13" fill="#3182ce"/><circle cx="590" cy="600" r="13" fill="#e53e3e"/><circle cx="590" cy="720" r="13" fill="#111827"/><circle cx="1000" cy="760" r="13" fill="#111827"/><text x="625" y="426" class="pin">GPIO17</text><text x="625" y="606" class="pin">3.3V</text><text x="625" y="726" class="pin">GND</text><text x="965" y="766" text-anchor="end" class="pin">GND</text>
<rect x="90" y="330" width="330" height="450" rx="26" class="box"/><text x="255" y="390" text-anchor="middle" class="label">KY-037 SOUND MODULE</text><text x="140" y="475" class="label">DO</text><text x="140" y="570" class="label">VCC</text><text x="140" y="665" class="label">GND</text><text x="140" y="745" class="label" fill="#8b5e34">AO — NC</text>
<path d="M420 470H510V420H577" class="wire" stroke="#3182ce"/><path d="M420 565H500V600H577" class="wire" stroke="#e53e3e"/><path d="M420 660H490V720H577" class="wire" stroke="#202a35"/><text x="90" y="825" class="sub">Tune the module trimpot; the final INO reads DO as HIGH/LOW.</text>
<path d="M1013 330H1150" class="wire" stroke="#e53e3e"/><path d="M1013 440H1150" class="wire" stroke="#d69e2e"/><path d="M1013 550H1150" class="wire" stroke="#38a169"/><rect x="1150" y="302" width="120" height="56" rx="10" class="box"/><rect x="1150" y="412" width="120" height="56" rx="10" class="box"/><rect x="1150" y="522" width="120" height="56" rx="10" class="box"/><text x="1210" y="337" text-anchor="middle" class="small">220 Ω</text><text x="1210" y="447" text-anchor="middle" class="small">220 Ω</text><text x="1210" y="557" text-anchor="middle" class="small">220 Ω</text><circle cx="1340" cy="330" r="36" fill="#ff4b55"/><circle cx="1340" cy="440" r="36" fill="#ffd43b"/><circle cx="1340" cy="550" r="36" fill="#46d16f"/><path d="M1270 330H1304M1270 440H1304M1270 550H1304" class="wire" stroke="#45515c"/><text x="1400" y="337" class="label">RED</text><text x="1400" y="447" class="label">YELLOW</text><text x="1400" y="557" class="label">GREEN</text>
<path d="M1340 366V760M1340 476V760M1340 586V760H1010M1010 760H1000" class="wire" stroke="#202a35"/><text x="1180" y="805" class="label">All grounds common</text><text x="70" y="965" class="sub">Power KY-037 from 3.3 V so its digital output cannot exceed the ESP32 input range.</text>
</svg>
