<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Traffic Signal stage 1 wiring</title><desc id="desc">Red LED on GPIO 4, yellow LED on GPIO 2, and green LED on GPIO 16, each through a 220 ohm resistor to a common ground.</desc>
<rect width="1600" height="1000" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#526174}.label{font-size:22px;font-weight:700}.small{font-size:18px}.pin{font-size:20px;fill:#fff;font-weight:700}.wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#263b50;stroke-width:4}</style>
<text x="70" y="72" class="title">Traffic Signal — Stage 1</text><text x="70" y="112" class="sub">Final pin map from TrafficSignal.ino • one resistor per LED</text>
<rect x="100" y="210" width="470" height="610" rx="38" fill="#16324a" stroke="#0b2032" stroke-width="6"/><text x="335" y="275" text-anchor="middle" font-size="38" font-weight="700" fill="white">ESP32</text><text x="335" y="312" text-anchor="middle" font-size="23" fill="#bde3ff">DEV MODULE</text>
<circle cx="570" cy="390" r="15" fill="#e53e3e"/><circle cx="570" cy="520" r="15" fill="#d69e2e"/><circle cx="570" cy="650" r="15" fill="#38a169"/><circle cx="335" cy="820" r="15" fill="#111827"/><text x="535" y="397" text-anchor="end" class="pin">GPIO4</text><text x="535" y="527" text-anchor="end" class="pin">GPIO2</text><text x="535" y="657" text-anchor="end" class="pin">GPIO16</text><text x="335" y="785" text-anchor="middle" class="pin">GND</text>
<path d="M585 390H800" class="wire" stroke="#e53e3e"/><path d="M585 520H800" class="wire" stroke="#d69e2e"/><path d="M585 650H800" class="wire" stroke="#38a169"/>
<rect x="800" y="360" width="180" height="60" rx="12" class="box"/><rect x="800" y="490" width="180" height="60" rx="12" class="box"/><rect x="800" y="620" width="180" height="60" rx="12" class="box"/><text x="890" y="398" text-anchor="middle" class="small">220 Ω</text><text x="890" y="528" text-anchor="middle" class="small">220 Ω</text><text x="890" y="658" text-anchor="middle" class="small">220 Ω</text>
<path d="M980 390H1090" class="wire" stroke="#e53e3e"/><path d="M980 520H1090" class="wire" stroke="#d69e2e"/><path d="M980 650H1090" class="wire" stroke="#38a169"/><circle cx="1150" cy="390" r="43" fill="#ff4b55" stroke="#8c1b1b" stroke-width="5"/><circle cx="1150" cy="520" r="43" fill="#ffd43b" stroke="#8c6d00" stroke-width="5"/><circle cx="1150" cy="650" r="43" fill="#46d16f" stroke="#126f31" stroke-width="5"/><text x="1230" y="398" class="label">RED LED</text><text x="1230" y="528" class="label">YELLOW LED</text><text x="1230" y="658" class="label">GREEN LED</text>
<path d="M1150 433V820M1150 563V820M1150 693V820M335 835V880H1150V820" class="wire" stroke="#202a35"/><text x="780" y="925" text-anchor="middle" class="label">Common GND — all LED cathodes (short legs)</text><text x="70" y="972" class="sub">Disconnect USB before rewiring. GPIO 2 must never be shorted directly to 3.3 V or GND.</text>
