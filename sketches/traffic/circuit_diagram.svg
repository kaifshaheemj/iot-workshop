<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Final Traffic Signal wiring</title><desc id="desc">ESP32 with traffic LEDs on GPIO 4, 2, and 16, KY-037 digital output on GPIO 17, and SH1106 OLED using SDA GPIO 22 and SCL GPIO 21.</desc>
<rect width="1600" height="1000" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:44px;font-weight:700}.sub{font-size:21px;fill:#526174}.label{font-size:20px;font-weight:700}.small{font-size:16px}.pin{font-size:17px;fill:#fff;font-weight:700}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#263b50;stroke-width:4}</style>
<text x="60" y="68" class="title">Traffic Signal — Final Wiring</text><text x="60" y="106" class="sub">TrafficSignal.ino • KY-037 digital events • SH1106 128×64 OLED at address 0x3C</text>
<rect x="590" y="155" width="390" height="730" rx="36" fill="#16324a" stroke="#0b2032" stroke-width="6"/><text x="785" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="white">ESP32</text>
<circle cx="980" cy="290" r="12" fill="#e53e3e"/><circle cx="980" cy="385" r="12" fill="#d69e2e"/><circle cx="980" cy="480" r="12" fill="#38a169"/><circle cx="980" cy="650" r="12" fill="#805ad5"/><circle cx="980" cy="725" r="12" fill="#319795"/><text x="945" y="296" text-anchor="end" class="pin">GPIO4</text><text x="945" y="391" text-anchor="end" class="pin">GPIO2</text><text x="945" y="486" text-anchor="end" class="pin">GPIO16</text><text x="945" y="656" text-anchor="end" class="pin">GPIO22 SDA</text><text x="945" y="731" text-anchor="end" class="pin">GPIO21 SCL</text>
<circle cx="590" cy="360" r="12" fill="#3182ce"/><circle cx="590" cy="585" r="12" fill="#e53e3e"/><circle cx="590" cy="790" r="12" fill="#111827"/><text x="625" y="366" class="pin">GPIO17</text><text x="625" y="591" class="pin">3.3V</text><text x="625" y="796" class="pin">GND</text>
<rect x="70" y="280" width="330" height="380" rx="24" class="box"/><text x="235" y="335" text-anchor="middle" class="label">KY-037</text><text x="115" y="425" class="label">DO</text><text x="115" y="510" class="label">VCC</text><text x="115" y="595" class="label">GND</text><text x="115" y="635" class="small">AO not connected</text><path d="M400 420H500V360H578" class="wire" stroke="#3182ce"/><path d="M400 505H500V585H578" class="wire" stroke="#e53e3e"/><path d="M400 590H490V790H578" class="wire" stroke="#202a35"/>
<path d="M992 290H1105" class="wire" stroke="#e53e3e"/><path d="M992 385H1105" class="wire" stroke="#d69e2e"/><path d="M992 480H1105" class="wire" stroke="#38a169"/><rect x="1105" y="265" width="105" height="50" rx="9" class="box"/><rect x="1105" y="360" width="105" height="50" rx="9" class="box"/><rect x="1105" y="455" width="105" height="50" rx="9" class="box"/><text x="1157" y="296" text-anchor="middle" class="small">220 Ω</text><text x="1157" y="391" text-anchor="middle" class="small">220 Ω</text><text x="1157" y="486" text-anchor="middle" class="small">220 Ω</text><circle cx="1280" cy="290" r="32" fill="#ff4b55"/><circle cx="1280" cy="385" r="32" fill="#ffd43b"/><circle cx="1280" cy="480" r="32" fill="#46d16f"/><path d="M1210 290H1248M1210 385H1248M1210 480H1248" class="wire" stroke="#45515c"/><text x="1330" y="297" class="label">RED</text><text x="1330" y="392" class="label">YELLOW</text><text x="1330" y="487" class="label">GREEN</text>
<rect x="1080" y="600" width="430" height="245" rx="24" fill="#e6edf3" stroke="#263b50" stroke-width="4"/><rect x="1125" y="640" width="220" height="150" rx="8" fill="#182b3a"/><text x="1235" y="715" text-anchor="middle" font-size="24" font-weight="700" fill="white">SH1106</text><text x="1380" y="650" class="label">SDA → GPIO 22</text><text x="1380" y="700" class="label">SCL → GPIO 21</text><text x="1380" y="750" class="label">VCC → 3.3V</text><text x="1380" y="800" class="label">GND → GND</text><path d="M992 650H1080M992 725H1050V700H1080" class="wire" stroke="#805ad5"/>
