<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Tripwire stage 1 wiring</title><desc id="desc">Laser module signal on GPIO 25 aimed at an LDR module whose analog output connects to GPIO 34. LDR uses 3.3 volts and both modules share ESP32 ground.</desc>
<rect width="1600" height="1000" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#526174}.label{font-size:22px;font-weight:700}.small{font-size:18px}.pin{font-size:19px;fill:#fff;font-weight:700}.wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#263b50;stroke-width:4}</style>
<text x="70" y="72" class="title">Tripwire — Stage 1</text><text x="70" y="112" class="sub">Power the laser and LDR, then measure beam-on and blocked values</text>
<rect x="580" y="205" width="440" height="650" rx="38" fill="#16324a" stroke="#0b2032" stroke-width="6"/><text x="800" y="270" text-anchor="middle" font-size="38" font-weight="700" fill="white">ESP32</text><circle cx="580" cy="400" r="14" fill="#d53f3a"/><circle cx="1020" cy="400" r="14" fill="#3182ce"/><circle cx="580" cy="610" r="14" fill="#e53e3e"/><circle cx="580" cy="755" r="14" fill="#111827"/><text x="615" y="407" class="pin">GPIO25</text><text x="985" y="407" text-anchor="end" class="pin">GPIO34</text><text x="615" y="617" class="pin">3.3V</text><text x="615" y="762" class="pin">GND</text>
<rect x="80" y="285" width="320" height="310" rx="24" class="box"/><text x="240" y="345" text-anchor="middle" class="label">LASER MODULE</text><text x="125" y="430" class="label">S</text><text x="125" y="500" class="label">VCC</text><text x="125" y="570" class="label">GND</text><path d="M400 425H500V400H566" class="wire" stroke="#d53f3a"/><path d="M400 495H500V610H566" class="wire" stroke="#e53e3e"/><path d="M400 565H480V755H566" class="wire" stroke="#202a35"/>
<rect x="1200" y="285" width="320" height="310" rx="24" class="box"/><text x="1360" y="345" text-anchor="middle" class="label">LDR MODULE</text><text x="1250" y="430" class="label">AO</text><text x="1250" y="500" class="label">VCC</text><text x="1250" y="570" class="label">GND</text><path d="M1034 400H1120V425H1200" class="wire" stroke="#3182ce"/><path d="M580 610H1100V495H1200" class="wire" stroke="#e53e3e"/><path d="M580 755H1130V565H1200" class="wire" stroke="#202a35"/>
<path d="M400 330H1200" class="wire" stroke="#f04455" stroke-dasharray="18 15"/><polygon points="1180,310 1220,330 1180,350" fill="#f04455"/><text x="800" y="320" text-anchor="middle" class="label" fill="#c53030">LASER BEAM — aim at LDR window</text>
<text x="70" y="925" class="label">Laser VCC: follow the module label (3.3 V or 5 V). LDR VCC: 3.3 V.</text><text x="70" y="968" class="sub">Never aim toward a face. Disconnect USB before changing signal or power wires.</text>
</svg>
