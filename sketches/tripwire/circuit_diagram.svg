<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Final Tripwire wiring</title><desc id="desc">Laser signal on GPIO 25, LDR analog output on GPIO 34, and active buzzer signal on GPIO 27. All modules share ESP32 ground.</desc>
<rect width="1600" height="1000" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:44px;font-weight:700}.sub{font-size:21px;fill:#526174}.label{font-size:20px;font-weight:700}.small{font-size:17px}.pin{font-size:18px;fill:#fff;font-weight:700}.wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#263b50;stroke-width:4}</style>
<text x="65" y="68" class="title">Tripwire — Final Wiring</text><text x="65" y="106" class="sub">Updated laser + LDR + active buzzer POC • no LED, servo, or web page</text>
<rect x="590" y="170" width="420" height="690" rx="38" fill="#16324a" stroke="#0b2032" stroke-width="6"/><text x="800" y="230" text-anchor="middle" font-size="36" font-weight="700" fill="white">ESP32</text><circle cx="590" cy="350" r="13" fill="#d53f3a"/><circle cx="1010" cy="350" r="13" fill="#3182ce"/><circle cx="1010" cy="520" r="13" fill="#805ad5"/><circle cx="590" cy="650" r="13" fill="#e53e3e"/><circle cx="590" cy="770" r="13" fill="#111827"/><text x="625" y="356" class="pin">GPIO25</text><text x="975" y="356" text-anchor="end" class="pin">GPIO34</text><text x="975" y="526" text-anchor="end" class="pin">GPIO27</text><text x="625" y="656" class="pin">3.3V</text><text x="625" y="776" class="pin">GND</text>
<rect x="70" y="255" width="330" height="300" rx="24" class="box"/><text x="235" y="310" text-anchor="middle" class="label">LASER MODULE</text><text x="115" y="390" class="label">S</text><text x="115" y="460" class="label">VCC</text><text x="115" y="530" class="label">GND</text><path d="M400 385H500V350H577" class="wire" stroke="#d53f3a"/><path d="M400 455H500V650H577" class="wire" stroke="#e53e3e"/><path d="M400 525H480V770H577" class="wire" stroke="#202a35"/>
<rect x="1190" y="190" width="340" height="270" rx="24" class="box"/><text x="1360" y="245" text-anchor="middle" class="label">LDR MODULE</text><text x="1235" y="320" class="label">AO</text><text x="1235" y="380" class="label">VCC 3.3V</text><text x="1235" y="430" class="label">GND</text><path d="M1023 350H1110V315H1190" class="wire" stroke="#3182ce"/>
<rect x="1190" y="540" width="340" height="270" rx="24" class="box"/><text x="1360" y="595" text-anchor="middle" class="label">ACTIVE BUZZER MODULE</text><text x="1235" y="665" class="label">SIG</text><text x="1235" y="725" class="label">VCC per label</text><text x="1235" y="775" class="label">GND</text><path d="M1023 520H1110V660H1190" class="wire" stroke="#805ad5"/>
<path d="M590 650H1080V375H1190M1080 650V720H1190" class="wire" stroke="#e53e3e"/><path d="M590 770H1100V425H1190M1100 770H1190" class="wire" stroke="#202a35"/><path d="M400 300H1190" class="wire" stroke="#f04455" stroke-dasharray="18 15"/><polygon points="1170,280 1210,300 1170,320" fill="#f04455"/><text x="800" y="290" text-anchor="middle" class="small" fill="#c53030">BEAM</text>
<text x="65" y="925" class="label">All grounds must connect. Use the provided active buzzer module, not a bare high-current buzzer.</text><text x="65" y="968" class="sub">Final logic: blocked light value &lt; THRESHOLD → GPIO 27 HIGH → alarm.</text>
</svg>
