<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Reaction Arena stage 2 wiring</title><desc id="desc">Four LED outputs on GPIO 16 through 19 and four matching buttons from GPIO 25, 26, 27, and 32 to ground using internal pull-up resistors.</desc>
<rect width="1600" height="1000" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:44px;font-weight:700}.sub{font-size:21px;fill:#526174}.label{font-size:19px;font-weight:700}.small{font-size:16px}.pin{font-size:17px;fill:#fff;font-weight:700}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#263b50;stroke-width:4}</style>
<text x="55" y="66" class="title">Reaction Arena — Stage 2</text><text x="55" y="103" class="sub">Each button number must match the LED number • buttons connect GPIO to GND</text>
<rect x="620" y="150" width="360" height="700" rx="36" fill="#16324a" stroke="#0b2032" stroke-width="6"/><text x="800" y="205" text-anchor="middle" font-size="34" font-weight="700" fill="white">ESP32</text>
<circle cx="620" cy="300" r="12" fill="#805ad5"/><circle cx="620" cy="430" r="12" fill="#805ad5"/><circle cx="620" cy="560" r="12" fill="#805ad5"/><circle cx="620" cy="690" r="12" fill="#805ad5"/><text x="655" y="306" class="pin">GPIO25</text><text x="655" y="436" class="pin">GPIO26</text><text x="655" y="566" class="pin">GPIO27</text><text x="655" y="696" class="pin">GPIO32</text>
<circle cx="980" cy="300" r="12" fill="#e53e3e"/><circle cx="980" cy="430" r="12" fill="#d69e2e"/><circle cx="980" cy="560" r="12" fill="#38a169"/><circle cx="980" cy="690" r="12" fill="#3182ce"/><text x="945" y="306" text-anchor="end" class="pin">GPIO16</text><text x="945" y="436" text-anchor="end" class="pin">GPIO17</text><text x="945" y="566" text-anchor="end" class="pin">GPIO18</text><text x="945" y="696" text-anchor="end" class="pin">GPIO19</text><text x="800" y="815" text-anchor="middle" class="pin">GND</text>
<g class="box"><rect x="250" y="270" width="170" height="60" rx="18"/><rect x="250" y="400" width="170" height="60" rx="18"/><rect x="250" y="530" width="170" height="60" rx="18"/><rect x="250" y="660" width="170" height="60" rx="18"/></g><text x="335" y="307" text-anchor="middle" class="label">BUTTON 1</text><text x="335" y="437" text-anchor="middle" class="label">BUTTON 2</text><text x="335" y="567" text-anchor="middle" class="label">BUTTON 3</text><text x="335" y="697" text-anchor="middle" class="label">BUTTON 4</text><path d="M420 300H608M420 430H608M420 560H608M420 690H608" class="wire" stroke="#805ad5"/><path d="M250 300H190V860M250 430H190M250 560H190M250 690H190" class="wire" stroke="#202a35"/><text x="70" y="485" class="small">INPUT_PULLUP</text><text x="70" y="515" class="small">pressed = LOW</text>
<path d="M992 300H1090M992 430H1090M992 560H1090M992 690H1090" class="wire" stroke="#3182ce"/><g class="box"><rect x="1090" y="274" width="120" height="52" rx="9"/><rect x="1090" y="404" width="120" height="52" rx="9"/><rect x="1090" y="534" width="120" height="52" rx="9"/><rect x="1090" y="664" width="120" height="52" rx="9"/></g><text x="1150" y="307" text-anchor="middle" class="small">220 Ω</text><text x="1150" y="437" text-anchor="middle" class="small">220 Ω</text><text x="1150" y="567" text-anchor="middle" class="small">220 Ω</text><text x="1150" y="697" text-anchor="middle" class="small">220 Ω</text><circle cx="1280" cy="300" r="33" fill="#ff5b62"/><circle cx="1280" cy="430" r="33" fill="#ffd43b"/><circle cx="1280" cy="560" r="33" fill="#46d16f"/><circle cx="1280" cy="690" r="33" fill="#4dabf7"/><path d="M1210 300H1247M1210 430H1247M1210 560H1247M1210 690H1247" class="wire" stroke="#45515c"/><text x="1340" y="307" class="label">LED 1</text><text x="1340" y="437" class="label">LED 2</text><text x="1340" y="567" class="label">LED 3</text><text x="1340" y="697" class="label">LED 4</text><path d="M1280 333V860M1280 463V860M1280 593V860M1280 723V860H190M800 850V860" class="wire" stroke="#202a35"/>
<text x="55" y="930" class="label">Channel pairs: 16↔25, 17↔26, 18↔27, 19↔32</text><text x="55" y="970" class="sub">No external button pull-up resistors are required. Rotate a tactile switch 90° if it always reads LOW.</text>
</svg>
