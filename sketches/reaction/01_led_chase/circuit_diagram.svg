<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Reaction Arena stage 1 wiring</title><desc id="desc">Four LEDs on GPIO 16, 17, 18, and 19, each through a 220 ohm resistor with cathodes connected to common ground.</desc>
<rect width="1600" height="1000" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#526174}.label{font-size:21px;font-weight:700}.small{font-size:17px}.pin{font-size:18px;fill:#fff;font-weight:700}.wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#263b50;stroke-width:4}</style>
<text x="70" y="70" class="title">Reaction Arena — Stage 1</text><text x="70" y="110" class="sub">Four LED outputs from ReactionTime.ino • label the channels 1 through 4</text>
<rect x="100" y="180" width="470" height="650" rx="38" fill="#16324a" stroke="#0b2032" stroke-width="6"/><text x="335" y="240" text-anchor="middle" font-size="36" font-weight="700" fill="white">ESP32</text><circle cx="570" cy="330" r="14" fill="#e53e3e"/><circle cx="570" cy="450" r="14" fill="#d69e2e"/><circle cx="570" cy="570" r="14" fill="#38a169"/><circle cx="570" cy="690" r="14" fill="#3182ce"/><circle cx="335" cy="830" r="14" fill="#111827"/><text x="535" y="337" text-anchor="end" class="pin">GPIO16</text><text x="535" y="457" text-anchor="end" class="pin">GPIO17</text><text x="535" y="577" text-anchor="end" class="pin">GPIO18</text><text x="535" y="697" text-anchor="end" class="pin">GPIO19</text><text x="335" y="795" text-anchor="middle" class="pin">GND</text>
<path d="M584 330H800M584 450H800M584 570H800M584 690H800" class="wire" stroke="#3182ce"/><rect x="800" y="302" width="170" height="56" rx="10" class="box"/><rect x="800" y="422" width="170" height="56" rx="10" class="box"/><rect x="800" y="542" width="170" height="56" rx="10" class="box"/><rect x="800" y="662" width="170" height="56" rx="10" class="box"/><text x="885" y="337" text-anchor="middle" class="small">220 Ω</text><text x="885" y="457" text-anchor="middle" class="small">220 Ω</text><text x="885" y="577" text-anchor="middle" class="small">220 Ω</text><text x="885" y="697" text-anchor="middle" class="small">220 Ω</text>
<path d="M970 330H1080M970 450H1080M970 570H1080M970 690H1080" class="wire" stroke="#45515c"/><circle cx="1140" cy="330" r="40" fill="#ff5b62"/><circle cx="1140" cy="450" r="40" fill="#ffd43b"/><circle cx="1140" cy="570" r="40" fill="#46d16f"/><circle cx="1140" cy="690" r="40" fill="#4dabf7"/><text x="1220" y="337" class="label">LED 1</text><text x="1220" y="457" class="label">LED 2</text><text x="1220" y="577" class="label">LED 3</text><text x="1220" y="697" class="label">LED 4</text><path d="M1140 370V830M1140 490V830M1140 610V830M1140 730V830H335" class="wire" stroke="#202a35"/>
<text x="70" y="925" class="label">LED anode (long leg) faces its resistor; cathode (short leg) returns to GND.</text><text x="70" y="970" class="sub">GPIO 18 is an active LED channel in this final POC; do not leave it reserved.</text>
